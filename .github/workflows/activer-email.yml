name: Activer la réception e-mail des commandes

# Déclenche l'e-mail d'activation FormSubmit vers la boîte d'Ougot,
# pour que la réception des commandes soit active sans manip côté site.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/activer-email.yml"

jobs:
  activer:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer la requête d'activation à FormSubmit
        run: |
          echo "Envoi de la demande d'activation à FormSubmit…"
          curl -sS -X POST "https://formsubmit.co/Marecyotam27@gmail.com" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "_subject=Activation de la réception des commandes Ougot" \
            --data-urlencode "name=Ougot" \
            --data-urlencode "message=Ceci active la réception des commandes par e-mail pour le site Ougot. Vous pouvez ignorer ce message une fois l'activation confirmée." \
            -o response.html -w "HTTP %{http_code}\n"
          echo "--- Réponse (extrait) ---"
          head -c 600 response.html || true
          echo ""
          echo "Terminé. Un e-mail d'activation FormSubmit devrait arriver dans la boîte Gmail (pensez aux spams)."
